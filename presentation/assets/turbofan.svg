<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" id="e1" class="engine-svg" role="img" aria-label="Illustrative turbofan schematic, not a validated engine simulation">
<defs>
  <linearGradient id="e1-cas" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E9F4F8"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2ECF2"/>
  </linearGradient>
  <linearGradient id="e1-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00A6C8" stop-opacity="0.95"/><stop offset="0.6" stop-color="#00A6C8" stop-opacity="0.35"/><stop offset="1" stop-color="#00A6C8" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="e1-fan" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.75" stop-color="#EEF6FA"/><stop offset="1" stop-color="#D3E6EE"/>
  </radialGradient>
  <filter id="e1-blur" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="e1-glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  #e1 .c{fill:none;stroke:#102A43;stroke-width:2;stroke-linejoin:round}
  #e1 .t{fill:none;stroke:#627D98;stroke-width:1.2}
  #e1 .st{stroke:#486581;fill:none;stroke-linecap:round}
  #e1 .blade{fill:#FFFFFF;stroke:#486581;stroke-width:1.1}
  #e1 .lead{stroke:#9FB3C8;stroke-width:1;stroke-dasharray:3 4}
  #e1 .zl{font:600 17px Aptos,'Segoe UI','Liberation Sans',Arial,sans-serif;fill:#627D98;letter-spacing:1.5px}
  #e1 .cap{font:italic 16px Aptos,'Segoe UI','Liberation Sans',Arial,sans-serif;fill:#627D98}
</style>
